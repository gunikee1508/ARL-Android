name: Publish ARL Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (must increase after first production release)'
        required: true
        type: number
      version_name:
        description: 'Public version name (example: 1.0.0)'
        required: true
        type: string
      min_version_code:
        description: 'Oldest launcher version allowed to play'
        required: true
        type: number
      mandatory:
        description: 'Force this launcher update before playing'
        required: true
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths:
      - 'release-requests/app.json'

permissions:
  contents: write

concurrency:
  group: arl-production-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ARL_KEYSTORE_PASSWORD: ${{ secrets.ARL_KEYSTORE_PASSWORD }}
      ARL_KEY_ALIAS: ${{ secrets.ARL_KEY_ALIAS }}
      ARL_KEY_PASSWORD: ${{ secrets.ARL_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout ARL repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release parameters
        shell: bash
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_MIN_VERSION_CODE: ${{ inputs.min_version_code }}
          INPUT_MANDATORY: ${{ inputs.mandatory }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            CODE="$INPUT_VERSION_CODE"
            NAME="$INPUT_VERSION_NAME"
            MIN="$INPUT_MIN_VERSION_CODE"
            MANDATORY="$INPUT_MANDATORY"
          else
            test -s release-requests/app.json
            eval "$(python3 - <<'PY'
          import json, shlex
          r=json.load(open('release-requests/app.json', encoding='utf-8'))
          print('CODE='+shlex.quote(str(r['versionCode'])))
          print('NAME='+shlex.quote(str(r['versionName'])))
          print('MIN='+shlex.quote(str(r.get('minVersionCode', r['versionCode']))))
          print('MANDATORY='+shlex.quote('true' if bool(r.get('mandatory', False)) else 'false'))
          PY
          )"
          fi
          echo "ARL_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "ARL_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "ARL_MIN_VERSION_CODE=$MIN" >> "$GITHUB_ENV"
          echo "ARL_MANDATORY=$MANDATORY" >> "$GITHUB_ENV"
          echo "Resolved ARL Android $NAME ($CODE), min=$MIN, mandatory=$MANDATORY"

      - name: Validate current production state
        run: python3 tools/production_state.py validate

      - name: Validate release inputs and signing secrets
        shell: bash
        env:
          ARL_KEYSTORE_BASE64: ${{ secrets.ARL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test "$ARL_VERSION_CODE" -gt 0
          test -n "$ARL_VERSION_NAME"
          test "$ARL_MIN_VERSION_CODE" -gt 0
          test "$ARL_MIN_VERSION_CODE" -le "$ARL_VERSION_CODE"
          test -n "$ARL_KEYSTORE_BASE64"
          test -n "$ARL_KEYSTORE_PASSWORD"
          test -n "$ARL_KEY_ALIAS"
          test -n "$ARL_KEY_PASSWORD"
          python3 - <<'PY'
          import json, os
          state=json.load(open('production-state.json', encoding='utf-8'))
          code=int(os.environ['ARL_VERSION_CODE'])
          old=[int(x['versionCode']) for x in state.get('history',{}).get('app',[]) if 'versionCode' in x]
          if old and code <= max(old):
              raise SystemExit(f'versionCode must increase: received {code}, current max is {max(old)}')
          name=os.environ['ARL_VERSION_NAME'].strip()
          if not name or any(c in name for c in '/\\\r\n\t'):
              raise SystemExit('Invalid version_name')
          PY
          printf '%s' "$ARL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arl-release.jks"
          test -s "$RUNNER_TEMP/arl-release.jks"
          echo "ARL_KEYSTORE_PATH=$RUNNER_TEMP/arl-release.jks" >> "$GITHUB_ENV"

      - name: Checkout SAMP-Mobile GTA-2.10
        uses: actions/checkout@v5
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.10
          path: upstream

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Install Android components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Apply ARL launcher overlay
        run: python3 apply_arl_phase1.py upstream

      - name: Apply upstream native build fixes
        run: python3 fix_upstream_native.py upstream

      - name: Build signed release APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace --no-daemon assembleRelease

      - name: Collect and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find upstream/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$SRC"
          mkdir -p release-output
          SAFE_NAME="$(printf '%s' "$ARL_VERSION_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          APK="release-output/Amazing-Real-Life-${SAFE_NAME}.apk"
          cp "$SRC" "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release-output/APKSIGNER.txt
          CERT_SHA="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-output/APKSIGNER.txt | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
          test "${#CERT_SHA}" -eq 64
          printf '%s' "$CERT_SHA" | grep -Eq '^[0-9a-f]{64}$'
          sha256sum "$APK" | tee release-output/SHA256SUMS.txt
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "ARL_CERT_SHA256=$CERT_SHA" >> "$GITHUB_ENV"

      - name: Enforce signing certificate continuity
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          state=json.load(open('production-state.json', encoding='utf-8'))
          saved=str(state.get('signingCertSha256','')).strip().lower()
          actual=os.environ['ARL_CERT_SHA256'].strip().lower()
          if not re.fullmatch(r'[0-9a-f]{64}', actual):
              raise SystemExit('Invalid APK signing certificate SHA-256')
          if saved and saved != actual:
              raise SystemExit('Signing certificate changed. Production release blocked to preserve Android update compatibility.')
          print('Signing certificate continuity OK:', actual)
          PY

      - name: Refuse to overwrite an existing APK release
        shell: bash
        run: |
          TAG="android-v${ARL_VERSION_NAME}-c${ARL_VERSION_CODE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; APK releases are immutable."
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish immutable signed APK release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" "$APK_PATH" release-output/SHA256SUMS.txt release-output/APKSIGNER.txt \
            --title "Amazing Real Life Android ${ARL_VERSION_NAME}" \
            --notes "Signed ARL Android launcher. versionCode ${ARL_VERSION_CODE}. Signing certificate continuity enforced by the production pipeline."

      - name: Sync latest main before activation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          python3 tools/production_state.py validate

      - name: Activate launcher APK update channel
        shell: bash
        run: |
          EXTRA=""
          if [ "$ARL_MANDATORY" = "true" ]; then EXTRA="--mandatory"; fi
          python3 tools/activate_arl_app.py \
            --launcher launcher.json \
            --apk "$APK_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --version-code "$ARL_VERSION_CODE" \
            --version-name "$ARL_VERSION_NAME" \
            --min-version-code "$ARL_MIN_VERSION_CODE" \
            $EXTRA
          python3 tools/production_state.py capture-app \
            --tag "$RELEASE_TAG" \
            --cert-sha256 "$ARL_CERT_SHA256"
          python3 tools/production_state.py validate

      - name: Health-check published APK asset
        shell: bash
        run: |
          URL="$(python3 -c "import json; print(json.load(open('launcher.json'))['app']['apkUrl'])")"
          echo "Checking $URL"
          curl --fail --silent --show-error --location --retry 4 \
            --connect-timeout 15 --max-time 60 --range 0-0 \
            "$URL" -o /dev/null

      - name: Commit active APK pointer and production state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher.json production-state.json
          git commit -m "Activate ARL Android ${ARL_VERSION_NAME} (${ARL_VERSION_CODE})"
          git push origin HEAD:main

      - name: Upload release audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARL-APK-release-audit
          path: |
            release-output/SHA256SUMS.txt
            release-output/APKSIGNER.txt
            launcher.json
            production-state.json
          if-no-files-found: error
