name: Phase 9.1 - Android Emulator Test Harness

on:
  workflow_dispatch:
  push:
    branches:
      - phase9-1-emulator-test-harness
    paths:
      - arl_overlay/**
      - tools/patch_arl_brasil_runtime.py
      - tools/patch_phase8_embedded_bootstrap.py
      - tools/patch_phase9_premium_client.py
      - tools/patch_phase9_1_emulator_harness.py
      - tools/run_phase9_1_emulator_test.sh
      - apply_arl_phase1.py
      - .github/workflows/test-phase9-1-emulator.yml

permissions:
  contents: read
  actions: read

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ARL_VERSION_CODE: '111'
      ARL_VERSION_NAME: '1.0.3-phase9.1-emulator'
      PHASE8_DATA_RUN_ID: '35151353048'
      PHASE8_DATA_PACKAGE_BYTES: '428375058'
      PHASE8_DATA_PACKAGE_SHA256: '6107f9da7a83e304de3d749b8ae70cb9ef563f634df04d88c9161a9fcb7d4889'

    steps:
      - name: Checkout ARL test harness
        uses: actions/checkout@v5

      - name: Download validated GTA Brasil DATA
        uses: actions/download-artifact@v4
        with:
          name: phase8-gta-brasil-arl-data
          path: phase8-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PHASE8_DATA_RUN_ID }}

      - name: Verify GTA Brasil DATA input
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$(find phase8-data -maxdepth 1 -type f -name 'arl-data-*.zip' -print -quit)"
          MANIFEST="$(find phase8-data -maxdepth 1 -type f -name 'arl-data-*.manifest.json' -print -quit)"
          META="$(find phase8-data -maxdepth 1 -type f -name 'arl-data-*.meta.json' -print -quit)"
          test -n "$PACKAGE" && test -n "$MANIFEST" && test -n "$META"
          test "$(stat -c %s "$PACKAGE")" = "$PHASE8_DATA_PACKAGE_BYTES"
          echo "$PHASE8_DATA_PACKAGE_SHA256  $PACKAGE" | sha256sum -c -
          python3 - "$MANIFEST" "$META" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding='utf-8'))
          meta = json.load(open(sys.argv[2], encoding='utf-8'))
          assert manifest['version'] == meta['version'] == 'phase8-gta-brasil-6417354'
          assert len(manifest['files']) == 8558
          paths = {x['path'] for x in manifest['files']}
          assert sum(p.startswith('texdb/arlbrasil/src/') and p.endswith('.png') for p in paths) == 8552
          assert 'arlbrasil/arlbrasil.img' in paths
          print('Phase 9.1 DATA source: OK')
          PY

      - name: Checkout SAMP-Mobile GTA-2.10
        uses: actions/checkout@v5
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.10
          path: upstream

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Verify Android SDK
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Java-only build SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Apply normal ARL overlay
        run: python3 apply_arl_phase1.py upstream

      - name: Wire GTA Brasil source parity
        run: python3 tools/patch_arl_brasil_runtime.py upstream

      - name: Wire bundled GTA Brasil bootstrap
        run: python3 tools/patch_phase8_embedded_bootstrap.py upstream

      - name: Apply Phase 9 premium source parity
        run: python3 tools/patch_phase9_premium_client.py upstream

      - name: Embed validated GTA Brasil DATA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/app/src/main/assets/arl
          PACKAGE="$(find phase8-data -maxdepth 1 -type f -name 'arl-data-*.zip' -print -quit)"
          MANIFEST="$(find phase8-data -maxdepth 1 -type f -name 'arl-data-*.manifest.json' -print -quit)"
          META="$(find phase8-data -maxdepth 1 -type f -name 'arl-data-*.meta.json' -print -quit)"
          cp "$PACKAGE" upstream/app/src/main/assets/arl/embedded-data.zip
          cp "$MANIFEST" upstream/app/src/main/assets/arl/embedded-data.manifest.json
          cp "$META" upstream/app/src/main/assets/arl/embedded-data.meta.json
          test "$(stat -c %s upstream/app/src/main/assets/arl/embedded-data.zip)" = "$PHASE8_DATA_PACKAGE_BYTES"
          echo "$PHASE8_DATA_PACKAGE_SHA256  upstream/app/src/main/assets/arl/embedded-data.zip" | sha256sum -c -

      - name: Convert build to emulator-safe harness
        run: python3 tools/patch_phase9_1_emulator_harness.py upstream

      - name: Verify emulator harness source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 111' upstream/app/build.gradle
          grep -q 'versionName "1.0.3-phase9.1-emulator"' upstream/app/build.gradle
          grep -q "'\*\*/\*.so'" upstream/app/build.gradle
          ! grep -q 'externalNativeBuild' upstream/app/build.gradle
          grep -q 'putBoolean("play_gate_ok", true)' upstream/app/src/main/java/com/samp/mobile/launcher/MainActivity.java
          ! grep -q 'startActivity(new Intent(this, SAMP.class));' upstream/app/src/main/java/com/samp/mobile/launcher/MainActivity.java
          grep -q 'ArlEmbeddedDataManager.installIfNeeded' upstream/app/src/main/java/com/samp/mobile/launcher/SplashActivity.java
          grep -q 'ENTRAR NO AMAZING REAL LIFE' upstream/app/src/main/res/layout/activity_main.xml
          grep -q 'arl_splash_status' upstream/app/src/main/res/layout/activity_splash.xml

      - name: Build Java-only emulator APK
        working-directory: upstream
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace --no-daemon assembleDebug

      - name: Validate emulator APK before boot
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find upstream/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          if unzip -l "$APK" | grep -Eq '(^|[[:space:]])lib/[^/]+/[^[:space:]]+\.so'; then
            echo 'Harness APK unexpectedly contains native .so files' >&2
            exit 1
          fi
          python3 - "$APK" "$PHASE8_DATA_PACKAGE_BYTES" "$PHASE8_DATA_PACKAGE_SHA256" <<'PY'
          import hashlib, json, sys, zipfile
          apk, expected_bytes, expected_sha = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          with zipfile.ZipFile(apk) as z:
              info = z.getinfo('assets/arl/embedded-data.zip')
              assert info.file_size == expected_bytes
              h = hashlib.sha256()
              with z.open(info) as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              assert h.hexdigest() == expected_sha
              meta = json.loads(z.read('assets/arl/embedded-data.meta.json'))
              assert meta['version'] == 'phase8-gta-brasil-6417354'
          print('Phase 9.1 emulator APK: assets OK, no native libs')
          PY
          mkdir -p emulator-output
          cp "$APK" emulator-output/ARL-Android-1.0.3-phase9.1-emulator-debug.apk
          sha256sum emulator-output/*.apk > emulator-output/SHA256SUMS.txt
          stat -c 'APK bytes: %s' emulator-output/*.apk > emulator-output/APK_SIZE.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Phase 9.1 on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/run_phase9_1_emulator_test.sh

      - name: Upload emulator evidence and harness APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARL-Phase9.1-Emulator-Test-Evidence
          path: emulator-output/*
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
