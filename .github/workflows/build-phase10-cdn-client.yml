name: Phase 10 - Build CDN Client

on:
  workflow_dispatch:
  push:
    branches:
      - phase10-cdn-differential-updater
    paths:
      - arl_overlay/**
      - launcher-phase10.json
      - tools/patch_arl_brasil_runtime.py
      - tools/patch_phase9_premium_client.py
      - apply_arl_phase1.py
      - fix_upstream_native.py
      - .github/workflows/build-phase10-cdn-client.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ARL_VERSION_CODE: '111'
      ARL_VERSION_NAME: '1.0.4-phase10-cdn'

    steps:
      - name: Checkout ARL Phase 10
        uses: actions/checkout@v5

      - name: Checkout SAMP-Mobile GTA-2.10
        uses: actions/checkout@v5
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.10
          path: upstream

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Verify Android SDK
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Apply ARL launcher overlay
        run: python3 apply_arl_phase1.py upstream

      - name: Wire GTA Brasil native runtime
        run: python3 tools/patch_arl_brasil_runtime.py upstream

      - name: Apply premium Phase 9 runtime/UI foundation
        run: python3 tools/patch_phase9_premium_client.py upstream

      - name: Apply upstream native build fixes
        run: python3 fix_upstream_native.py upstream

      - name: Verify Phase 10 source invariants
        shell: bash
        run: |
          set -euo pipefail
          JAVA=upstream/app/src/main/java/com/samp/mobile/launcher
          grep -q 'dataPackages()' "$JAVA/ArlDataManager.java"
          grep -q 'Range' "$JAVA/ArlDataManager.java"
          grep -q 'packageMode()' "$JAVA/ArlRemoteConfig.java"
          grep -q 'phase10-cdn-differential-updater/launcher-phase10.json' "$JAVA/ArlConfig.java"
          grep -q 'ENTRAR NO AMAZING REAL LIFE' upstream/app/src/main/res/layout/activity_main.xml
          grep -q 'ArlRuntimeGuard::BootSnapshot();' upstream/app/src/main/cpp/samp/main.cpp
          grep -q 'CStreaming::AddImageToList(kImgRelative, true)' upstream/app/src/main/cpp/samp/arl/ArlBrasilLayer.cpp
          grep -q 'versionCode 111' upstream/app/build.gradle
          grep -q 'versionName "1.0.4-phase10-cdn"' upstream/app/build.gradle
          test ! -e upstream/app/src/main/assets/arl/embedded-data.zip

      - name: Make Gradle executable
        run: chmod +x upstream/gradlew

      - name: Build Phase 10 debug APK
        working-directory: upstream
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: ./gradlew --stacktrace --no-daemon assembleDebug

      - name: Audit APK is lightweight and not bundled with Phase 8 DATA
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find upstream/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              assert 'assets/arl/embedded-data.zip' not in names
              assert any(n.endswith('/libsamp.so') for n in names)
          print('Phase 10 lightweight APK audit: OK')
          PY

      - name: Collect Phase 10 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find upstream/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          cp "$APK" output/ARL-Android-1.0.4-phase10-cdn-debug.apk
          sha256sum output/*.apk | tee output/SHA256SUMS.txt
          stat -c 'APK bytes: %s' output/*.apk | tee output/APK_SIZE.txt
          cat > output/PHASE10.txt <<'TXT'
          ARL Android 1.0.4-phase10-cdn
          - GTA Brasil ARL assets are no longer embedded in the APK.
          - Differential package manifest with SHA-256 validation.
          - HTTP Range resume support using persistent .part downloads.
          - Repairs only packages whose installed files are missing or invalid.
          - Phase 9 premium native UI/runtime foundation preserved.
          TXT

      - name: Upload Phase 10 APK
        uses: actions/upload-artifact@v4
        with:
          name: ARL-Android-1.0.4-phase10-cdn-debug
          path: output/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
