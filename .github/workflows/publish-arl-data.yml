name: Publish ARL Android DATA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'DATA version (example: 1.0.0)'
        required: true
        type: string
      source_url:
        description: 'Direct HTTPS URL to the real ARL DATA ZIP'
        required: true
        type: string
      source_sha256:
        description: 'Optional SHA-256 of the source ZIP before repackaging'
        required: false
        type: string
      strip_single_root:
        description: 'Strip one wrapper directory from the source ZIP'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: arl-data-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_URL: ${{ inputs.source_url }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate current production state
        run: python3 tools/production_state.py validate

      - name: Validate release inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.parse import urlparse
          v=os.environ['VERSION'].strip()
          if not v or any(c in v for c in '/\\\r\n\t'):
              raise SystemExit('Invalid version')
          u=urlparse(os.environ['SOURCE_URL'].strip())
          if u.scheme != 'https' or not u.netloc:
              raise SystemExit('source_url must be a direct HTTPS URL')
          s=os.environ.get('SOURCE_SHA256','').strip()
          if s and not re.fullmatch(r'[0-9a-fA-F]{64}', s):
              raise SystemExit('source_sha256 must be 64 hex characters')
          state=json.load(open('production-state.json', encoding='utf-8'))
          if any(str(x.get('version')) == v for x in state.get('history',{}).get('data',[])):
              raise SystemExit('DATA version already exists in production history; releases are immutable')
          PY

      - name: Download source DATA
        shell: bash
        run: |
          mkdir -p source-data
          curl --fail --location --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 3600 \
            "$SOURCE_URL" -o source-data/arl-data-source.zip
          test -s source-data/arl-data-source.zip

      - name: Verify source checksum when supplied
        if: ${{ inputs.source_sha256 != '' }}
        shell: bash
        run: |
          ACTUAL="$(sha256sum source-data/arl-data-source.zip | awk '{print $1}')"
          test "${ACTUAL,,}" = "${SOURCE_SHA256,,}"
          echo "Source SHA-256 OK: $ACTUAL"

      - name: Build normalized DATA package and manifest
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.strip_single_root }}" = "false" ]; then
            EXTRA="--no-strip-single-root"
          fi
          python3 tools/build_arl_data.py \
            --source source-data/arl-data-source.zip \
            --version "$VERSION" \
            --output dist-data \
            $EXTRA

      - name: Enforce GitHub Release asset size limit
        shell: bash
        run: |
          ZIP="$(find dist-data -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          SIZE="$(stat -c '%s' "$ZIP")"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "DATA ZIP is >= 2 GiB. Publish it on the ARL CDN/VPS instead of GitHub Releases."
            exit 1
          fi

      - name: Refuse to overwrite an existing DATA release
        shell: bash
        run: |
          TAG="data-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. DATA releases are immutable; choose a new version."
            exit 1
          fi

      - name: Publish immutable DATA release
        shell: bash
        run: |
          TAG="data-v${VERSION}"
          ZIP="$(find dist-data -maxdepth 1 -type f -name '*.zip' -print -quit)"
          MANIFEST="$(find dist-data -maxdepth 1 -type f -name '*.manifest.json' -print -quit)"
          META="$(find dist-data -maxdepth 1 -type f -name '*.meta.json' -print -quit)"
          gh release create "$TAG" "$ZIP" "$MANIFEST" "$META" \
            --title "ARL Android DATA v${VERSION}" \
            --notes "Immutable ARL Android DATA package v${VERSION}. Generated by the ARL production release pipeline with package and per-file SHA-256 verification."

      - name: Activate DATA version in launcher.json
        shell: bash
        run: |
          TAG="data-v${VERSION}"
          META="$(find dist-data -maxdepth 1 -type f -name '*.meta.json' -print -quit)"
          python3 tools/activate_arl_data.py \
            --launcher launcher.json \
            --metadata "$META" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG"
          python3 tools/production_state.py capture-data --tag "$TAG"
          python3 tools/production_state.py validate

      - name: Health-check published DATA assets
        shell: bash
        run: |
          set -euo pipefail
          readarray -t URLS < <(python3 - <<'PY'
          import json
          d=json.load(open('launcher.json', encoding='utf-8'))['client']['data']
          print(d['url'])
          print(d['manifestUrl'])
          PY
          )
          for url in "${URLS[@]}"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --retry 4 \
              --connect-timeout 15 --max-time 60 --range 0-0 \
              "$url" -o /dev/null
          done

      - name: Commit active DATA pointer and production state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher.json production-state.json
          git commit -m "Activate ARL Android DATA v${VERSION}"
          git push origin HEAD:main

      - name: Upload release audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARL-DATA-v${{ inputs.version }}-audit
          path: |
            dist-data/*.manifest.json
            dist-data/*.meta.json
            launcher.json
            production-state.json
          if-no-files-found: error
