name: Phase 10 - Probe Android 14 ARM64 Software Emulator

on:
  workflow_dispatch:
  push:
    branches:
      - phase10-native-arm64-runtime-test
    paths:
      - .github/workflows/probe-android14-arm64-software-emulator.yml

permissions:
  contents: read

jobs:
  boot-arm64-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      AVD_NAME: arl_arm64_api34
    steps:
      - name: Prepare Android ARM64 image
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "system-images;android-34;default;arm64-v8a"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name "$AVD_NAME" \
            --package "system-images;android-34;default;arm64-v8a" \
            --device "pixel_6"
          printf '%s\n' \
            'hw.cpu.ncore=4' \
            'hw.ramSize=3072' \
            'hw.gpu.enabled=yes' \
            'hw.gpu.mode=swiftshader_indirect' \
            'disk.dataPartition.size=8G' \
            >> "$HOME/.android/avd/${AVD_NAME}.avd/config.ini"

      - name: Boot ARM64 Android 14 by software emulation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arm64-emulator-evidence
          adb kill-server || true
          adb start-server
          "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" \
            -port 5554 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            -verbose \
            > arm64-emulator-evidence/emulator.log 2>&1 &
          EMU_PID=$!
          echo "$EMU_PID" > arm64-emulator-evidence/emulator.pid

          BOOT=0
          for i in $(seq 1 180); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo 'Emulator process exited before Android boot' >&2
              tail -200 arm64-emulator-evidence/emulator.log || true
              exit 1
            fi
            STATE="$(adb -s emulator-5554 get-state 2>/dev/null || true)"
            DONE="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            echo "attempt=$i state=$STATE boot=$DONE"
            if [ "$DONE" = "1" ]; then BOOT=1; break; fi
            sleep 5
          done

          if [ "$BOOT" != "1" ]; then
            echo 'ARM64 Android did not boot within probe window' >&2
            tail -300 arm64-emulator-evidence/emulator.log || true
            exit 1
          fi

          adb -s emulator-5554 shell getprop ro.product.cpu.abi | tee arm64-emulator-evidence/guest_abi.txt
          adb -s emulator-5554 shell getprop ro.build.version.release | tee arm64-emulator-evidence/android_version.txt
          adb -s emulator-5554 shell getprop ro.build.version.sdk | tee arm64-emulator-evidence/api.txt
          test "$(tr -d '\r' < arm64-emulator-evidence/guest_abi.txt)" = "arm64-v8a"
          test "$(tr -d '\r' < arm64-emulator-evidence/api.txt)" = "34"
          adb -s emulator-5554 shell uname -m | tee arm64-emulator-evidence/guest_uname.txt
          echo 'RESULTADO FINAL: ARM64 ANDROID 14 SOFTWARE EMULATOR PASS' | tee arm64-emulator-evidence/RESULT.txt
          adb -s emulator-5554 emu kill || true

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARL-Android14-ARM64-Software-Emulator-Probe
          path: arm64-emulator-evidence/*
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
