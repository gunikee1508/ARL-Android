name: Phase 11 - Build Zero Setup Client

on:
  workflow_dispatch:
  push:
    branches:
      - phase11-zero-setup-base
    paths:
      - arl_overlay/**
      - launcher-phase11.json
      - launcher-phase11-base.json
      - tools/patch_arl_brasil_runtime.py
      - tools/patch_phase9_premium_client.py
      - apply_arl_phase1.py
      - fix_upstream_native.py
      - .github/workflows/build-phase11-zero-setup.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ARL_VERSION_CODE: '112'
      ARL_VERSION_NAME: '1.0.5-phase11-zero-setup'

    steps:
      - name: Checkout ARL Phase 11
        uses: actions/checkout@v5

      - name: Checkout SAMP-Mobile GTA-2.10
        uses: actions/checkout@v5
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.10
          path: upstream

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Install Android components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Apply ARL launcher overlay
        run: python3 apply_arl_phase1.py upstream

      - name: Wire GTA Brasil native runtime
        run: python3 tools/patch_arl_brasil_runtime.py upstream

      - name: Apply premium runtime UI
        run: python3 tools/patch_phase9_premium_client.py upstream

      - name: Apply upstream native build fixes
        run: python3 fix_upstream_native.py upstream

      - name: Verify Phase 11 source invariants
        shell: bash
        run: |
          set -euo pipefail
          JAVA=upstream/app/src/main/java/com/samp/mobile/launcher
          test -f "$JAVA/ArlBaseDownloadManager.java"
          grep -q 'distributionAuthorized' "$JAVA/ArlRemoteConfig.java"
          grep -q 'baseManifestReady' "$JAVA/ArlRemoteConfig.java"
          grep -q 'ArlBaseDownloadManager.installOrRepair' "$JAVA/SplashActivity.java"
          grep -q 'ArlBaseDownloadManager.isConfigured' "$JAVA/MainActivity.java"
          grep -q 'Range' "$JAVA/ArlBaseDownloadManager.java"
          grep -q 'SHA-256' "$JAVA/ArlBaseDownloadManager.java"
          grep -q 'ArlGtaBaseValidator.isValid(root)' "$JAVA/ArlBaseImportManager.java"
          grep -q 'phase11-zero-setup-base/launcher-phase11-base.json' "$JAVA/ArlConfig.java"
          grep -q '"distributionAuthorized": false' launcher-phase11.json
          grep -q 'ENTRAR NO AMAZING REAL LIFE' upstream/app/src/main/res/layout/activity_main.xml
          grep -q 'ArlRuntimeGuard::BootSnapshot();' upstream/app/src/main/cpp/samp/main.cpp
          grep -q 'CStreaming::AddImageToList(kImgRelative, true)' upstream/app/src/main/cpp/samp/arl/ArlBrasilLayer.cpp
          grep -q 'versionCode 112' upstream/app/build.gradle
          grep -q 'versionName "1.0.5-phase11-zero-setup"' upstream/app/build.gradle
          test ! -e upstream/app/src/main/assets/arl/embedded-data.zip

      - name: Build Phase 11 debug APK
        working-directory: upstream
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace --no-daemon assembleDebug

      - name: Audit lightweight dual-ABI APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find upstream/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              assert 'assets/arl/embedded-data.zip' not in names
              assert 'lib/arm64-v8a/libsamp.so' in names
              assert 'lib/armeabi-v7a/libsamp.so' in names
              assert any(n.endswith('/libGTASA.so') for n in names)
          print('Phase 11 zero-setup APK audit: OK')
          PY

      - name: Collect Phase 11 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find upstream/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          cp "$APK" output/ARL-Android-1.0.5-phase11-zero-setup-debug.apk
          sha256sum output/*.apk | tee output/SHA256SUMS.txt
          stat -c 'APK bytes: %s' output/*.apk | tee output/APK_SIZE.txt
          cat > output/PHASE11.txt <<'TXT'
          ARL Android 1.0.5-phase11-zero-setup
          - ARM32 + ARM64 in one APK.
          - ARL/GTA Brasil DATA remains CDN-managed and differential.
          - Adds an optional authorized GTA base manifest stage before ARL DATA.
          - Base packages support SHA-256, resume, staging and repair.
          - Automatic base download activates ONLY when launcher config and base
            manifest both declare distributionAuthorized=true.
          - No Rockstar GTA data is added to the ARL CDN by this workflow.
          TXT

      - name: Upload Phase 11 APK
        uses: actions/upload-artifact@v4
        with:
          name: ARL-Android-1.0.5-phase11-zero-setup-debug
          path: output/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
